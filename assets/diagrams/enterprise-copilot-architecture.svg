  <rect class="box" x="530" y="220" width="140" height="48"/><text class="t" x="600" y="248">Dataverse</text>
  <rect class="box" x="370" y="300" width="140" height="48"/><text class="t" x="440" y="328">Vector Index</text>
  <path class="arr" d="M260,220 V168"/><path class="arr" d="M430,220 V168"/><path class="arr" d="M600,220 V136 H510"/><path class="arr" d="M440,300 V136"/>
